<div class="profile-container">
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Meu Perfil</h1>
      <p class="page-subtitle">Gerencie suas informações pessoais</p>
    </div>
  </div>

  <app-loading *ngIf="isLoading"></app-loading>

  <div class="profile-content" *ngIf="!isLoading">
    <div class="profile-card">
      <form (ngSubmit)="saveProfile()" class="profile-form">
        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label">Nome Completo <span class="required">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="Seu nome" required />
          </div>

          <div class="form-group full-width">
            <label class="form-label">E-mail <span class="required">*</span></label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn btn-save" [disabled]="isSaving">
            <i class="fa-solid fa-spinner fa-spin" *ngIf="isSaving"></i>
            <i class="fa-solid fa-check" *ngIf="!isSaving"></i>
            <span>{{ isSaving ? 'Salvando...' : 'Salvar Alterações' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
